name: 自動更新量化市場數據

on:
  schedule:
    # 每個工作日 (週一至週五) UTC 時間 22:00 執行 (約美股收盤後)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # 允許在 GitHub 網頁上手動點擊執行

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 取得倉庫程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴套件 (yfinance, pandas)
        run: pip install yfinance pandas

      - name: 執行 Python 爬蟲與運算腳本
        run: python update_data.py

      - name: 提交更新後的 data.json
        run: |
          git config --global user.name "Quant Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data [skip ci]" && git push)
