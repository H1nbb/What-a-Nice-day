name: 自動更新量化市場數據

on:
  schedule:
    - cron: '0 22 * * 1-5' # 每個工作日美股收盤後自動執行
  workflow_dispatch:        # 允許手動點擊按鈕執行

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 取得倉庫程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: pip install yfinance pandas

      - name: 執行 Python 爬蟲與運算
        run: python update_data.py

      - name: 提交更新後的 data.json
        run: |
          git config --global user.name "Quant Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data [skip ci]" && git push)
