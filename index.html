<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>核心資產 - 24小時夜盤行情監控</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #131722;
      --text-color: #d1d4dc;
      --accent-color: #2962ff;
      --border-color: #2a2e39;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
    }
    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }
    h1 {
      font-size: 1.5rem;
      color: #ffffff;
      margin: 0 0 8px 0;
    }
    p.subtitle {
      color: #787b86;
      font-size: 0.9rem;
      margin: 0;
    }
    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      padding: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>

  <header>
    <h1>核心資產行情監控</h1>
    <p class="subtitle">大數字為正規收盤價，括號內為最新夜盤、盤前與盤後即時價格</p>
  </header>

  <div class="asset-grid">
    <!-- SPY -->
    <div class="card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
        {
          "symbol": "AMEX:SPY",
          "width": "100%",
          "colorTheme": "dark",
          "isTransparent": true,
          "locale": "zh_TW"
        }
        </script>
      </div>
    </div>

    <!-- QQQ -->
    <div class="card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
        {

          "width": "100%",
          "colorTheme": "dark",

        }

    </div>

    <!-- SOXX -->

      <div class="tradingview-widget-container">

    <!-- SGOV -->

</body>
</html>
