<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柔粉美股現金流 & 晨報 Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #fdf2f8; color: #831843; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
        .pink-card { background: #ffffff; border: 1px solid #fbcfe8; border-radius: 16px; box-shadow: 0 4px 15px rgba(244, 114, 182, 0.08); }
        .tab-btn.active { background-color: #be185d; color: #ffffff; font-weight: bold; }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-6">

    <!-- Header -->
    <header class="bg-gradient-to-r from-pink-400 via-rose-300 to-pink-300 text-white py-4 px-6 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white/30 p-2 rounded-2xl">
                    <i class="fa-solid fa-sack-dollar text-2xl text-pink-800"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-pink-950">美股量化 & 現金流 Dashboard</h1>
                    <p class="text-xs text-pink-900/80">Baby Pink 護眼模式 • 直觀列表 & 中文新聞流</p>
                </div>
            </div>

            <nav class="flex bg-white/40 p-1 rounded-xl backdrop-blur-md gap-1">
                <button onclick="switchTab('macro')" id="btn-macro" class="tab-btn active px-4 py-1.5 rounded-lg text-xs transition-all">核心資產列表</button>
                <button onclick="switchTab('cashflow')" id="btn-cashflow" class="tab-btn px-4 py-1.5 rounded-lg text-xs text-pink-950 transition-all">現金流雷達</button>
                <button onclick="switchTab('news')" id="btn-news" class="tab-btn px-4 py-1.5 rounded-lg text-xs text-pink-950 transition-all">中文新聞流</button>
                <button onclick="switchTab('heatmap')" id="btn-heatmap" class="tab-btn px-4 py-1.5 rounded-lg text-xs text-pink-950 transition-all">全市場熱力圖</button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6 flex-1 w-full space-y-6">

        <!-- 頁面 1：核心資產即時列表 (原油、SPY、QQQ、美債、SPYI/QQQI 一目了然) -->
        <div id="tab-macro" class="tab-content space-y-6">
            <div class="pink-card p-6">
                <h2 class="text-base font-bold text-pink-950 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-pink-500"></i> 全資產即時數據清單 (原油 / 大盤 / 美債 / 現金流標的)
                </h2>
                <!-- TradingView Market Overview Widget (LIST VIEW) -->
                <div class="tradingview-widget-container" style="height: 600px;">
                  <div class="tradingview-widget-container__widget"></div>
                  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
                  {
                  "colorTheme": "light",
                  "dateRange": "1D",
                  "showChart": true,
                  "locale": "zh_TW",
                  "width": "100%",
                  "height": "100%",
                  "largeChartUrl": "",
                  "isTransparent": true,
                  "showSymbolLogo": true,
                  "showFloatingTooltip": false,
                  "tabs": [
                    {
                      "title": "重點資產總覽",
                      "symbols": [
                        { "s": "TVC:USOIL", "d": "WTI 原油價格" },
                        { "s": "AMEX:SPY", "d": "SPY (標普 500 ETF)" },
                        { "s": "NASDAQ:QQQ", "d": "QQQ (納指 100 ETF)" },
                        { "s": "TVC:US10Y", "d": "10 年期美債收益率" },
                        { "s": "TVC:VIX", "d": "VIX 恐慌指數" },
                        { "s": "NEO:SPYI", "d": "SPYI (高股息 ETF)" },
                        { "s": "NEO:QQQI", "d": "QQQI (科技高股息 ETF)" },
                        { "s": "AMEX:DIVO", "title": "DIVO" }
                      ]
                    }
                  ]
                }
                  </script>
                </div>
            </div>
        </div>

        <!-- 頁面 2：現金流雷達 -->
        <div id="tab-cashflow" class="tab-content hidden space-y-6">
            <div class="pink-card p-6">
                <h2 class="text-base font-bold text-pink-950 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-sack-dollar text-pink-500"></i> 現金流與高股息 ETF 即時行情表
                </h2>
                <div class="tradingview-widget-container" style="height: 550px;">
                  <div class="tradingview-widget-container__widget"></div>
                  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-screener.js" async>
                  {
                  "width": "100%",
                  "height": "100%",
                  "defaultColumn": "overview",
                  "defaultScreen": "general",
                  "market": "america",
                  "showToolbar": true,
                  "colorTheme": "light",
                  "locale": "zh_TW",
                  "symbols": {
                    "tickers": [
                      "NEO:SPYI",
                      "NEO:QQQI",
                      "AMEX:DIVO",
                      "AMEX:JEPI",
                      "AMEX:JEPQ"
                    ]
                  }
                }
                  </script>
                </div>
            </div>
        </div>

        <!-- 頁面 3：中文新聞流 (繁體中文 + 點擊看原文) -->
        <div id="tab-news" class="tab-content hidden space-y-6">
            <div class="pink-card p-6">
                <h2 class="text-base font-bold text-pink-950 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-newspaper text-pink-500"></i> 全中文美股財經新聞流 (包含摘要與原文連結)
                </h2>
                <div class="tradingview-widget-container" style="height: 600px;">
                  <div class="tradingview-widget-container__widget"></div>
                  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
                  {
                  "feedMode": "market",
                  "market": "stock",
                  "colorTheme": "light",
                  "isTransparent": true,
                  "displayMode": "regular",
                  "width": "100%",
                  "height": "100%",
                  "locale": "zh_TW"
                }
                  </script>
                </div>
            </div>
        </div>

        <!-- 頁面 4：全市場熱力圖 (滿版) -->
        <div id="tab-heatmap" class="tab-content hidden space-y-6">
            <div class="pink-card p-6">
                <h2 class="text-base font-bold text-pink-950 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-fire text-pink-500"></i> S&P 500 板塊資金熱力圖
                </h2>
                <div class="tradingview-widget-container" style="height: 650px;">
                  <div class="tradingview-widget-container__widget"></div>
                  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
                  {
                  "exchanges": [],
                  "dataSource": "SPX500",
                  "grouping": "sector",
                  "blockSize": "market_cap_basic",
                  "blockColor": "change",
                  "locale": "zh_TW",
                  "colorTheme": "light",
                  "hasTopBar": true,
                  "isDataSetEnabled": true,
                  "isZoomEnabled": true,
                  "hasSymbolTooltip": true,
                  "width": "100%",
                  "height": "100%"
                }
                  </script>
                </div>
            </div>
        </div>

    </main>

    <!-- 分頁切換 JavaScript -->
    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active');
                el.classList.add('text-pink-950');
            });

            document.getElementById('tab-' + tabName).classList.remove('hidden');
            const activeBtn = document.getElementById('btn-' + tabName);
            activeBtn.classList.add('active');
            activeBtn.classList.remove('text-pink-950');
        }
    </script>
</body>
</html>
