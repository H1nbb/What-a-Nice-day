<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柔粉美股現金流 & 晨報 Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #fdf2f8; color: #831843; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .pink-card { background: #ffffff; border: 1px solid #fbcfe8; border-radius: 16px; box-shadow: 0 4px 15px rgba(244, 114, 182, 0.08); }
    </style>
</head>
<body class="pb-12">

    <!-- Header 頂部導航 -->
    <header class="bg-gradient-to-r from-pink-400 via-rose-300 to-pink-300 text-white py-5 px-6 shadow-sm mb-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white/30 p-2.5 rounded-2xl backdrop-blur-md">
                    <i class="fa-solid fa-piggy-bank text-2xl text-pink-700"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-pink-950">美股現金流 & 晨報 Dashboard</h1>
                    <p class="text-xs text-pink-900/80">Baby Pink 護眼模式 • SPYI / QQQI 高股息即時動態</p>
                </div>
            </div>
            <div>
                <span class="bg-white/40 text-pink-900 font-semibold border border-pink-300/50 text-xs px-3 py-1.5 rounded-full flex items-center gap-2 backdrop-blur-md">
                    <span class="w-2 h-2 rounded-full bg-pink-600 animate-pulse"></span>
                    API 即時連線中
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 space-y-6">

        <!-- 1. 頂部即時滾動跑馬燈（包含核心指數與 SPYI/QQQI） -->
        <div class="pink-card overflow-hidden p-2">
            <div class="tradingview-widget-container">
              <div class="tradingview-widget-container__widget"></div>
              <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
              {
              "symbols": [
                { "proName": "NEO:SPYI", "title": "SPYI (高股息)" },
                { "proName": "NEO:QQQI", "title": "QQQI (科技高股息)" },
                { "proName": "AMEX:DIVO", "title": "DIVO" },
                { "proName": "AMEX:JEPI", "title": "JEPI" },
                { "proName": "FOREXCOM:SPXUSD", "title": "標普 500" },
                { "proName": "TVC:US10Y", "title": "10年美債" },
                { "proName": "TVC:VIX", "title": "VIX 恐慌" }
              ],
              "showSymbolLogo": true,
              "isTransparent": true,
              "displayMode": "adaptive",
              "colorTheme": "light",
              "locale": "zh_TW"
            }
              </script>
            </div>
        </div>

        <!-- 2. 現金流高股息 ETF 專屬監控板塊 (SPYI / QQQI / DIVO / JEPI) -->
        <div class="pink-card p-5">
            <div class="flex justify-between items-center mb-4 border-b border-pink-100 pb-3">
                <h2 class="text-base font-bold text-pink-950 flex items-center gap-2">
                    <i class="fa-solid fa-sack-dollar text-pink-500"></i> 即時現金流 & 股息 ETF 動態雷達 (SPYI / QQQI / DIVO)
                </h2>
                <span class="text-xs bg-pink-100 text-pink-700 px-2.5 py-1 rounded-md font-medium">交易所 Live 數據</span>
            </div>
            <div class="tradingview-widget-container" style="height: 380px;">
              <div class="tradingview-widget-container__widget"></div>
              <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-screener.js" async>
              {
              "width": "100%",
              "height": "100%",
              "defaultColumn": "overview",
              "defaultScreen": "general",
              "market": "america",
              "showToolbar": false,
              "colorTheme": "light",
              "locale": "zh_TW",
              "symbols": {
                "tickers": [
                  "NEO:SPYI",
                  "NEO:QQQI",
                  "AMEX:DIVO",
                  "AMEX:JEPI",
                  "AMEX:JEPQ",
                  "AMEX:VTV"
                ]
              }
            }
              </script>
            </div>
        </div>

        <!-- 3. 大盤 K 線圖與【可點擊閱讀】即時新聞流 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- 左側：標普 SPY 即時走勢 -->
            <div class="lg:col-span-2 pink-card p-5">
                <h2 class="text-base font-bold text-pink-950 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-chart-area text-pink-500"></i> SPY / 大盤即時技術走勢
                </h2>
                <div class="tradingview-widget-container" style="height: 360px;">
                  <div id="tradingview_chart" style="height: 100%;"></div>
                  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                  <script type="text/javascript">
                  new TradingView.widget({
                  "autosize": true,
                  "symbol": "AMEX:SPY",
                  "interval": "D",
                  "timezone": "Asia/Hong_Kong",
                  "theme": "light",
                  "style": "1",
                  "locale": "zh_TW",
                  "toolbar_bg": "#f1f3f6",
                  "enable_publishing": false,
                  "allow_symbol_change": true,
                  "container_id": "tradingview_chart"
                });
                  </script>
                </div>
            </div>

            <!-- 右側：即時美股新聞（可直接點擊看原文與詳細出處） -->
            <div class="pink-card p-5">
                <h2 class="text-base font-bold text-pink-950 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-newspaper text-pink-500"></i> 即時美股頭條新聞（點擊可睇原文）
                </h2>
                <div class="tradingview-widget-container" style="height: 360px;">
                  <div class="tradingview-widget-container__widget"></div>
                  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
                  {
                  "feedMode": "market",
                  "market": "stock",
                  "colorTheme": "light",
                  "isTransparent": true,
                  "displayMode": "regular",
                  "width": "100%",
                  "height": "100%",
                  "locale": "zh_TW"
                }
                  </script>
                </div>
            </div>

        </div>

        <!-- 4. S&P 500 板塊熱力圖 -->
        <div class="pink-card p-5">
            <h2 class="text-base font-bold text-pink-950 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-border-all text-pink-500"></i> S&P 500 板塊資金熱力圖
            </h2>
            <div class="tradingview-widget-container" style="height: 420px;">
              <div class="tradingview-widget-container__widget"></div>
              <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
              {
              "exchanges": [],
              "dataSource": "SPX500",
              "grouping": "sector",
              "blockSize": "market_cap_basic",
              "blockColor": "change",
              "locale": "zh_TW",
              "symbolUrl": "",
              "colorTheme": "light",
              "hasTopBar": false,
              "isDataSetEnabled": false,
              "isZoomEnabled": true,
              "hasSymbolTooltip": true,
              "width": "100%",
              "height": "100%"
            }
              </script>
            </div>
        </div>

    </main>

    <footer class="text-center text-xs text-pink-400 mt-8">
        <p>© 柔粉美股晨報 & 現金流 Dashboard • Powered by TradingView Live API</p>
    </footer>

</body>
</html>
